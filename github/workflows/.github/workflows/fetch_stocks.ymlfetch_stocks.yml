name: Fetch Piotroski India Data

on:
  workflow_dispatch: {}        # lets you trigger manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy openpyxl tradingview_screener

      - name: Run fetch script
        run: python fetch_stocks.py

      - name: Archive latest snapshot only
        run: |
          mkdir -p archive
          STAMP=$(date -u +"%Y-%m-%d")
          rm -f archive/*.csv archive/*.xlsx        # wipe previous archive so only latest survives
          cp piotroski_india.csv  "archive/piotroski_india_${STAMP}.csv"
          cp piotroski_india.xlsx "archive/piotroski_india_${STAMP}.xlsx"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add piotroski_india.csv piotroski_india.xlsx archive/
          git diff --cached --quiet || git commit -m "chore: refresh Piotroski India data $(date -u +%F)"
          git push
