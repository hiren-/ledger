name: Fetch TradingView OHLCV Data

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas tvkit

      - name: Run tvkit fetch
        continue-on-error: true          # <-- don't fail the job on non-zero exit
        run: python fetch_tvkit.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh OHLCV prices $(date -u +%F)"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push failed, retrying ($i)..."
            sleep $((RANDOM % 5 + 1))
          done

          echo "Failed to push after retries."
          exit 1
